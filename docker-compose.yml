services:
    laravel.test:
        image: 'sail-8.3/app'
        build:
            context: './vendor/laravel/sail/runtimes/8.3'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql: 
                condition: service_healthy
            redis: 
                condition: service_healthy
    pgsql:
        image: 'postgres:16'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-visualrent_db}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-U'
                - '${DB_USERNAME:-sail}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/var/lib/redis/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    genkit-sidecar:
        build: 
            context: ./genkit-sidecar 
            dockerfile: Dockerfile
        ports: 
            - '${FORWARD_GENKIT_PORT:-4000}:4000'
        environment: 
            GEMINI_API_KEY: '${GEMINI_API_KEY}'
            PORT: 4000
        volumes: 
            - './genkit-sidecar:/app'
            - '/app/node_modules'
        networks: 
            - sail
    evolution-api:
        image: evoapicloud/evolution-api:latest
        ports: 
            - '${FORWARD_EVOLUTION_PORT:-8080}:8080'
        environment: 
            SERVER_URL: 'http://localhost:8080'
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY:-visualrent_secret_key}'
            DATABASE_ENABLED: 'false'
            DATABASE_PROVIDER: 'postgresql'
            DEL_INSTANCE: 'false'
        volumes:
            - 'sail-evolution-instances:/larevel/instances'
        networks: 
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-evolution-instances:
        driver: local